plugins {
    id 'java'
}

// Sources live under src/ (not the Gradle default src/main/java).
sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = []
        }
    }
}

dependencies {
    // Starsector API, its bundled libs, and LunaLib are all provided at runtime by
    // the game/other mods, so they are compile-only. Taken from the game folder named by
    // starsectorPath in gradle.properties.
    compileOnly fileTree(dir: "${starsectorPath}/starsector-core", include: ['starfarer.api.jar', 'json.jar', 'log4j-1.2.9.jar', 'lwjgl.jar', 'lwjgl_util.jar', 'xstream-1.4.10.jar'])
    compileOnly fileTree(dir: "${starsectorPath}/mods", include: ['**/LunaLib.jar', '**/lw_Console.jar'])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Starsector 0.98a runs a Java 17 JRE; target Java 8 bytecode for broad
    // compatibility (loads on the JRE8 patch as well as JRE17).
    options.release = 8
}

jar {
    archiveFileName = 'PrivateArsenal.jar'
    destinationDirectory = file('jars')
    manifest {
        attributes('Main-Class': 'privatearsenal.PrivateArsenalModPlugin')
    }
}

// Only what the game loads. Development helpers such as utils/ stay out of the release.
def releaseFiles = copySpec {
    from(projectDir) {
        include 'mod_info.json', 're_private_arsenal.version', 'icon.png'
        include 'data/**', 'graphics/**', 'jars/PrivateArsenal.jar'
    }
}

// The mod manager installs the folder inside the ZIP as-is.
tasks.register('stageRelease', Sync) {
    dependsOn tasks.named('jar')
    with releaseFiles
    into layout.projectDirectory.dir('ReverseEngineeredPrivateArsenal')
}

tasks.register('releaseZip', Zip) {
    dependsOn tasks.named('stageRelease')
    destinationDirectory = layout.projectDirectory
    archiveFileName = 'PrivateArsenal.zip'
    into('ReverseEngineeredPrivateArsenal') { with releaseFiles }
}
